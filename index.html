<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesa de Dirección</title>
<meta name="theme-color" content="#134382">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mesa ARME">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#134382; --azul-osc:#0c2c57; --azul-suave:#e8eef7;
  --fondo:#f2f4f8; --texto:#17202e; --gris:#566174; --borde:#d4dbe7;
  --q1:#c62828; --q2:#2e7d32; --q3:#d27600; --q4:#6b7280;
  --ok:#2e7d32; --warn:#e3a600; --bad:#c62828;
  --nw:270px;
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;font-family:'Atkinson Hyperlegible',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--fondo);color:var(--texto);line-height:1.4;padding-bottom:180px;-webkit-text-size-adjust:100%}
body.con-modal{overflow:hidden}
button{font:inherit;cursor:pointer;color:inherit}
button:disabled{cursor:default}
:focus-visible{outline:3px solid #f2b600;outline-offset:2px}

/* Encabezado */
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:4px solid var(--azul);display:flex;align-items:center;gap:14px;padding:10px 22px}
.top img{height:46px;width:auto}
.top h1{font-size:1.3rem;margin:0;color:var(--azul);flex:1;letter-spacing:.2px}
.rol{background:var(--azul);color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:.85rem}
.ibtn{background:var(--azul-suave);border:0;border-radius:12px;min-width:50px;height:50px;color:var(--azul);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-weight:700;font-size:.9rem}
.ibtn svg{width:22px;height:22px}
.demo{background:#fff6d8;color:#7a5200;text-align:center;font-weight:700;padding:8px 14px;font-size:.9rem;border-bottom:1px solid #f0dc9a}

/* Indicadores */
.kpis{display:grid;grid-template-columns:1.25fr 1fr 1fr;gap:14px;padding:18px 22px 4px;max-width:1320px;margin:0 auto}
.kpi{background:#fff;border-radius:18px;padding:16px 18px;border:1px solid var(--borde);display:flex;align-items:center;gap:16px;text-align:left;width:100%}
button.kpi:hover{border-color:var(--azul)}
.kpi .num{font-size:2.6rem;font-weight:700;line-height:1}
.kpi .lbl{font-size:1rem;font-weight:700}
.kpi .sub{font-size:.85rem;color:var(--gris)}
.luz{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18)}
.luz.rojo{animation:late 1.2s ease-in-out infinite}
@keyframes late{0%,100%{box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 0 0 rgba(198,40,40,.5)}50%{box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 0 12px rgba(198,40,40,0)}}
.mini{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;font-size:.85rem;color:var(--gris)}
.mini i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.alarma{max-width:1320px;margin:12px auto 0;padding:0 22px}
.alarma div{background:var(--bad);color:#fff;border-radius:14px;padding:14px 18px;font-weight:700;display:flex;gap:12px;align-items:center}
.alarma svg{width:28px;height:28px;flex:none}

/* Pestañas */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:14px 22px 6px;max-width:1320px;margin:0 auto;scrollbar-width:none}
.tab{border:2px solid var(--borde);background:#fff;border-radius:999px;padding:10px 20px;font-weight:700;color:var(--gris);white-space:nowrap;min-height:52px;font-size:1rem}
.tab.on{background:var(--azul);border-color:var(--azul);color:#fff}
.badge{display:inline-block;background:var(--q3);color:#fff;border-radius:999px;padding:0 9px;margin-left:6px;font-size:.85rem;line-height:1.5}
.tab.on .badge{background:#fff;color:var(--azul)}
.vista{max-width:1320px;margin:0 auto;padding:8px 22px 24px}

/* Matriz */
.barra{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 12px}
.tit{margin:0;font-size:1.35rem;color:var(--azul)}
.ayuda{color:var(--gris);margin:4px 0 14px;font-size:.95rem}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:.95rem;color:var(--gris);font-weight:700;cursor:pointer}
.tog input{width:22px;height:22px;accent-color:var(--azul)}
.matriz{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cuad{background:#fff;border-radius:18px;border:1px solid var(--borde);border-top:8px solid var(--c);min-height:200px;display:flex;flex-direction:column}
.cuad header{padding:14px 18px 6px;display:flex;align-items:center;gap:12px}
.cuad h2{margin:0;font-size:1.3rem;color:var(--c)}
.cuad .sub{color:var(--gris);font-size:.88rem}
.cuad .cnt{margin-left:auto;background:var(--c);color:#fff;font-weight:700;border-radius:12px;padding:2px 14px;font-size:1.2rem}
.lista{padding:6px 12px 14px;display:flex;flex-direction:column;gap:10px}
.card{display:block;text-align:left;width:100%;background:#fff;border:1px solid var(--borde);border-left:7px solid var(--c);border-radius:12px;padding:12px 14px}
.card:hover{background:#f7f9fc}
.card .t,.idea .t,.ag .t{font-weight:700;font-size:1.05rem}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:6px;font-size:.85rem;color:var(--gris);align-items:center}
.chip{border-radius:999px;padding:3px 10px;font-weight:700;font-size:.8rem;background:var(--azul-suave);color:var(--azul);white-space:nowrap}
.chip.ok{background:#e2f1e4;color:#1c6a21}
.chip.esp{background:#fff1cf;color:#865600}
.chip.bloq{background:#fde3e3;color:#a41c1c}
.chip.reas{background:#efe6fb;color:#5b2d9c}
.reas-t{color:#5b2d9c}
.vencida{color:var(--bad);font-weight:700}
.vacio{color:var(--gris);font-style:italic;padding:10px 6px}

/* Ideas y paneles */
.panel{background:#fff;border:1px solid var(--borde);border-radius:18px;padding:18px 20px}
.cnt-s{background:var(--q3);color:#fff;border-radius:10px;padding:0 10px;font-size:1rem;vertical-align:3px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.idea{border:1px solid var(--borde);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;background:#fbfcfe}
.idea .det{color:var(--gris);font-size:.95rem}
.idea .btn{margin-top:auto}

/* Agenda */
.alta{display:flex;gap:10px;margin-bottom:12px}
.alta .in{flex:1}
.ag{display:flex;gap:14px;align-items:center;border:1px solid var(--borde);border-radius:12px;padding:12px 14px;background:#fff}
.ag.hecho .t{text-decoration:line-through;color:var(--gris)}
.check{width:44px;height:44px;flex:none;border:3px solid var(--azul);border-radius:10px;background:#fff;color:#fff;font-size:1.3rem;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
.check.on{background:var(--ok);border-color:var(--ok)}
details.hist{margin-top:14px}
details.hist summary{cursor:pointer;font-weight:700;color:var(--gris);padding:8px 0}
.sub-t{font-size:1.1rem;color:var(--azul);margin:22px 0 8px}

/* Gantt */
.leyenda{display:flex;flex-wrap:wrap;gap:8px 18px;margin:6px 0 14px;font-size:.9rem;color:var(--gris)}
.ley i{display:inline-block;width:16px;height:16px;border-radius:4px;margin-right:6px;vertical-align:-3px}
.ley i.hoy-i{width:3px;background:var(--bad);border-radius:0}
.gantt{border:1px solid var(--borde);border-radius:14px;overflow:hidden;background:#fff}
.g-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.g-row{display:flex;min-height:62px;border-bottom:1px solid #edf0f5;position:relative}
.g-name{position:sticky;left:0;z-index:3;background:#fff;width:var(--nw);flex:none;padding:8px 12px;border:0;border-right:2px solid var(--borde);border-left:6px solid var(--c);text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px}
button.g-name:hover{background:#f7f9fc}
.g-name span{font-weight:700;font-size:1rem;line-height:1.25}
.g-name small{color:var(--gris);font-size:.8rem}
.g-head{min-height:64px;background:#f7f9fc}
.g-head .g-name{background:#f7f9fc;border-left-color:transparent;font-weight:700;color:var(--gris)}
.g-head .g-track{height:64px}
.g-track{position:relative;flex:none}
.mes{position:absolute;top:0;height:32px;border-left:2px solid var(--borde);padding:7px 8px;font-weight:700;color:var(--azul);font-size:.88rem;white-space:nowrap;overflow:hidden}
.dia{position:absolute;top:34px;height:26px;line-height:26px;text-align:center;font-size:.78rem;color:var(--gris);font-weight:700}
.dia.fin{color:#a6aebb}
.dia.hoy{background:var(--bad);color:#fff;border-radius:7px}
.dia.semh{text-align:left;padding-left:6px;border-left:1px solid var(--borde)}
.hoy-tag{position:absolute;top:36px;transform:translateX(-50%);background:var(--bad);color:#fff;border-radius:6px;padding:0 6px;font-size:.72rem;font-weight:700;line-height:20px;z-index:2}
.g-body{position:relative}
.g-over{position:absolute;top:0;bottom:0;left:var(--nw);pointer-events:none;z-index:0}
.fds{position:absolute;top:0;bottom:0;background:#f4f6fa}
.g-sem{position:absolute;top:0;bottom:0;border-left:1px solid #e1e6ee}
.g-hoy{position:absolute;top:0;bottom:0;width:3px;background:var(--bad);opacity:.85}
.g-row .g-track{z-index:1}
.g-bar{position:absolute;top:13px;height:36px;border-radius:9px;background:var(--c);color:#fff;font-size:.85rem;font-weight:700;padding:0 10px;display:flex;align-items:center;white-space:nowrap;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.12)}
.g-bar.venc{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--bad)}
.g-bar.cerr{opacity:.4}
.g-hito{position:absolute;top:19px;width:24px;height:24px;background:var(--c);transform:rotate(45deg);border-radius:4px}
.g-hito.venc{box-shadow:0 0 0 3px var(--bad)}
.g-lbl{position:absolute;top:21px;font-size:.85rem;color:var(--texto);white-space:nowrap;font-weight:700}
.ley i.venc-i{background:#fff;box-shadow:0 0 0 2px var(--bad)}

/* Botones */
.btn{min-height:56px;border:0;border-radius:14px;padding:0 24px;font-weight:700;font-size:1.05rem}
.btn.pri{background:var(--azul);color:#fff}
.btn.pri:hover{background:var(--azul-osc)}
.btn.sec{background:var(--azul-suave);color:var(--azul)}
.btn.peligro{background:#fde3e3;color:#a41c1c}
.btn.ancho{width:100%}
.btn.volver{background:#fff;border:2px solid #b9c2d0;color:var(--gris);order:9}
.btn.volver:hover{background:#f4f6fa}
.modal{position:relative}
.x{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:50%;border:2px solid #b9c2d0;background:#fff;color:var(--gris);font-size:1.3rem;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2}
.x:hover{background:#f4f6fa}
.modal h3{padding-right:56px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;justify-content:center;z-index:30;background:var(--azul);color:#fff;border:0;border-radius:18px;min-height:66px;padding:0 28px;font-size:1.2rem;font-weight:700;box-shadow:0 8px 24px rgba(19,67,130,.4);display:flex;align-items:center;gap:10px}
.fab svg{width:28px;height:28px}

/* Modal */
.velo{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:28px 12px;overflow-y:auto}
.modal{background:#fff;border-radius:20px;width:100%;max-width:660px;padding:22px 24px 24px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal h3{margin:6px 0 10px;font-size:1.45rem;color:var(--azul);line-height:1.25}
.pill{display:inline-block;background:var(--c);color:#fff;border-radius:999px;padding:4px 14px;font-weight:700;font-size:.9rem}
.det{color:var(--gris);white-space:pre-wrap}
label.l{display:block;font-weight:700;margin:18px 0 8px;font-size:1.02rem}
.nota{font-weight:400;color:var(--gris);font-size:.9rem}
.in{width:100%;font:inherit;font-size:1.05rem;border:2px solid var(--borde);border-radius:12px;padding:12px 14px;background:#fff;color:var(--texto)}
textarea.in{min-height:100px;resize:vertical}
textarea.grande{min-height:130px;font-size:1.15rem;padding-right:70px}
.in:focus{outline:none;border-color:var(--azul)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg5{grid-template-columns:repeat(5,1fr)}
.seg button{min-height:56px;border:2px solid var(--borde);background:#fff;border-radius:12px;font-weight:700;font-size:1rem;padding:4px}
.seg button.on{background:var(--azul);border-color:var(--azul);color:#fff}
.seg button:disabled:not(.on){opacity:.55}
.datos{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;margin:14px 0 0;background:#f6f8fb;border-radius:14px;padding:14px 16px}
.datos dt{font-size:.8rem;color:var(--gris);font-weight:700}
.datos dd{margin:2px 0 0;font-weight:700}
.leer{background:#f6f8fb;border-radius:12px;padding:12px 14px;white-space:pre-wrap}
.acciones{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.acciones .btn.pri{flex:1 1 200px}
.destino{margin-top:18px;border-radius:14px;padding:14px 18px;color:#fff;background:var(--c);font-size:1.25rem;font-weight:700}
.destino small{display:block;font-weight:400;font-size:.9rem;opacity:.9}
.aviso{margin-top:18px;border:2px dashed var(--borde);border-radius:14px;padding:14px 16px;color:var(--gris)}
.cambiar{margin-top:10px;font-size:.9rem;color:var(--gris);font-weight:700}
.qbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.qbtns button{min-height:48px;border:2px solid var(--c);color:var(--c);background:#fff;border-radius:10px;font-weight:700;font-size:.85rem;padding:4px}
.qbtns button.on{background:var(--c);color:#fff}
.dos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.oculto{display:none}
.err{color:var(--bad);font-weight:700;margin-top:12px}
.dict{position:relative}
.mic{position:absolute;right:10px;top:10px;width:52px;height:52px;border-radius:50%;border:0;background:var(--azul-suave);color:var(--azul);display:flex;align-items:center;justify-content:center}
.mic svg{width:26px;height:26px}
.mic.on{background:var(--bad);color:#fff;animation:late 1.2s infinite}

/* Login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:#fff;border-radius:24px;padding:34px 30px;max-width:420px;width:100%;text-align:center;border-top:8px solid var(--azul);box-shadow:0 10px 40px rgba(19,67,130,.12)}
.login-logo{width:240px;max-width:80%;height:auto}
.login h1{color:var(--azul);margin:18px 0 4px;font-size:1.6rem}
.login p{color:var(--gris);margin:0 0 18px}
.pin{text-align:center;font-size:1.8rem;letter-spacing:10px}
.rec{display:flex;gap:10px;align-items:center;justify-content:center;margin:14px 0 18px;color:var(--gris);font-size:.95rem}
.rec input{width:22px;height:22px;accent-color:var(--azul)}
.demo-hint{margin-top:16px!important;font-size:.85rem;background:#fff6d8;color:#7a5200;border-radius:10px;padding:8px}

/* Estados */
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);z-index:90;display:none;align-items:center;justify-content:center}
#busy.on{display:flex}
#busy div{background:var(--azul);color:#fff;border-radius:14px;padding:16px 26px;font-weight:700;display:flex;gap:12px;align-items:center}
#busy span{width:22px;height:22px;border:3px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:gira .8s linear infinite}
@keyframes gira{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:170px;transform:translateX(-50%);z-index:95;background:#17202e;color:#fff;border-radius:14px;padding:14px 22px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#toast.bad{background:var(--bad)}

/* Celular */
@media (max-width:800px){
  .matriz{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi.hacer{grid-column:1/-1}
}
@media (max-width:600px){
  html{font-size:17px}
  :root{--nw:150px}
  .top{padding:8px 12px;gap:8px}
  .top img{height:30px}
  .top h1{font-size:.95rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rol{padding:4px 10px;font-size:.78rem}
  .ibtn{min-width:44px;height:44px;padding:0}
  .ibtn .txt{display:none}
  .kpis,.tabs,.vista,.alarma{padding-left:12px;padding-right:12px}
  .kpi{padding:12px 14px;gap:12px}
  .kpi .num{font-size:2.1rem}
  .luz{width:38px;height:38px}
  .seg5{grid-template-columns:repeat(2,1fr)}
  .qbtns{grid-template-columns:1fr 1fr}
  .datos,.dos{grid-template-columns:1fr}
  .modal{padding:18px 16px 20px}
  .fab{bottom:70px;width:min(340px,calc(100% - 24px))}
  .alta{flex-direction:column}
  .acciones .btn{flex:1 1 40%}
  .acciones .btn.volver{flex:1 1 100%}
  .g-name small{display:none}
}
@media print{.fab,.tabs,.top .ibtn{display:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="busy"><div><span></span><b id="busyTxt">Cargando…</b></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';

/* ============================================================
   CONFIGURACIÓN
   Pegá entre las comillas la URL de la aplicación web de
   Apps Script (la que termina en /exec).
   Si queda vacía, la app funciona en MODO DEMOSTRACIÓN.
   ============================================================ */

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function pd(s) { if (!s) return null; const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2] - 1, +m[3], 12) : null; }
function fd(d) { const z = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()); }
function addD(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function dif(a, b) { return Math.round((b - a) / 864e5); }
function fmt(s) { const d = pd(s); if (!d) return '—'; return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); }
function fcorta(s) { const d = pd(s); return d ? d.getDate() + ' ' + MESES[d.getMonth()] : ''; }
function hoyD() { return pd(S.hoy) || pd(fd(new Date())); }
function dias(s) { const d = pd(s); return d ? Math.max(dif(d, hoyD()), 0) : 0; }
function haceTxt(s) { const n = dias(s); return n === 0 ? 'hoy' : n === 1 ? 'hace 1 día' : 'hace ' + n + ' días'; }
const colorCuad = k => (CUADS.find(c => c.k === k) || { c: 'var(--azul)' }).c;

// Regla de ubicación: urgente = "Mucho"; importante = "Algo" o "Mucho"
function sugerir(u, i) {
  if (!u || !i) return '';
  const urg = u === 'Mucho', imp = i !== 'Poco';
  return urg && imp ? 'Hacer ya' : imp ? 'Programar' : urg ? 'Delegar' : 'No es de Dirección';
}

const ideas = () => S.temas.filter(t => t.etapa === 'Idea');
const tareas = () => S.temas.filter(t => t.etapa === 'Tarea');
const abiertas = () => tareas().filter(t => t.avance !== 'Cerrado');
const enTema = t => ['Aceptado', 'En curso', 'Bloqueado', 'Cerrado'].indexOf(t.avance) >= 0;
const vencida = t => { const l = pd(t.limite); return !!l && l < hoyD() && t.avance !== 'Cerrado' && t.etapa === 'Tarea'; };

async function apiGet(pin) {
  if (DEMO) return Demo.get(pin);

}
async function leerRespuesta(r) {
  const txt = await r.text();
  let j;
  try { j = JSON.parse(txt); } catch (e) { throw new Error('La planilla no respondió bien. Probá de nuevo en un momento.'); }
  if (!j.ok) throw new Error(j.error || 'Error');
  return j.data;
}
async function apiPost(accion, extra) {
  if (DEMO) return Demo.post(S.rol, accion, extra);
  // Las escrituras viajan por GET: es el camino más confiable con Apps Script
  const q = new URLSearchParams({ pin: S.pin, accion: accion, t: Date.now() });
  if (extra && extra.id) q.set('id', extra.id);
  q.set('datos', JSON.stringify((extra && extra.datos) || {}));
  const r = await fetch(API_URL + '?' + q.toString());
  return leerRespuesta(r);
}
function aplicar(d) {
  S.rol = d.rol; S.temas = d.temas || []; S.agenda = d.agenda || [];
  S.semaforo = d.semaforo || S.semaforo; S.hoy = d.hoy || fd(new Date());
}
async function recargar(silencioso) {
  try { aplicar(await apiGet(S.pin)); render(); if (!silencioso) toast('Actualizado'); }
  catch (e) { if (!silencioso) toast('No se pudo actualizar. Revisá la conexión.', true); }
}
async function enviar(accion, extra, okMsg) {
  if (S.ocupado) return false;
  ocupado(true, 'Guardando…');
  try {
    await apiPost(accion, extra);
    aplicar(await apiGet(S.pin));
    render();
    if (okMsg) toast(okMsg);
    return true;
  } catch (e) {
    toast(e.message || 'No se pudo guardar', true);
    return false;
  } finally { ocupado(false); }
}

/* ---------- Ingreso ---------- */
function guardarPin(p) { try { p ? localStorage.setItem('mesa_pin', p) : localStorage.removeItem('mesa_pin'); } catch (e) {} }
function leerPin() { try { return localStorage.getItem('mesa_pin') || ''; } catch (e) { return ''; } }

function vistaLogin(msg) {
  S.rol = '';
  $('#app').innerHTML = `
  <div class="login"><div class="login-box">
    <img src="${LOGO}" alt="Tecnología ARME" class="login-logo">
    <h1>Mesa de Dirección</h1>
    <p>Ingresá tu PIN para entrar</p>
    <input id="pin" class="in pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="12" aria-label="PIN">
    <label class="rec"><input type="checkbox" id="recordar" checked> Recordarme en este equipo</label>
    ${msg ? `<div class="err">${esc(msg)}</div>` : ''}
    <button class="btn pri ancho" data-act="entrar">Entrar</button>
    ${DEMO ? '<p class="demo-hint">Modo demostración · CEO: 1111 · COO: 2222</p>' : ''}
  </div></div>`;
  const p = $('#pin'); p.focus();
  p.addEventListener('keydown', e => { if (e.key === 'Enter') doEntrar(); });
}
function doEntrar() {
  const pin = ($('#pin').value || '').trim();
  if (!pin) return vistaLogin('Escribí tu PIN.');
  entrar(pin, $('#recordar').checked);
}
async function entrar(pin, recordar) {
  ocupado(true, 'Entrando…');
  try {
    aplicar(await apiGet(pin));
    S.pin = pin;
    guardarPin(recordar ? pin : '');
    render();
  } catch (e) {
    guardarPin('');
    vistaLogin(e.message === 'PIN incorrecto' ? 'PIN incorrecto. Probá de nuevo.' : 'No se pudo conectar. Revisá internet.');
  } finally { ocupado(false); }
}

/* ---------- Pantalla principal ---------- */
function render() {

  $('#app').innerHTML = cabecera() + (DEMO ? '<div class="demo">Modo demostración · los datos son de ejemplo y no se guardan en la planilla</div>' : '')
    + indicadores() + alarma() + pestanas()
    + `<main class="vista">${(vistas[S.tab] || vistaMatriz)()}</main>`
    + `<button class="fab" data-act="nueva">${IC.mas}Nueva idea</button>`;

    const g = $('#gScroll');
    if (g) { const nw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--nw')) || 0; g.scrollLeft = Math.max(S.xHoy - (g.clientWidth - nw) * 0.3, 0); }

}

function cabecera() {

/* ---------- Tarjetas ---------- */
function chipCoo(t) {

}
function chipAvance(t) {
  if (!t.avance || t.avance === 'Recibido') return '';
  const cls = t.avance === 'Bloqueado' ? 'bloq' : '';
  return `<span class="chip ${cls}">${esc(t.avance)}</span>`;
}
function card(t) {
  const v = vencida(t);
  return `<button class="card" style="--c:${colorCuad(t.cuadrante)}" data-act="ver" data-id="${esc(t.id)}">
    <div class="t">${esc(t.tema)}</div>

      ${respTxt(t)}
    </div></button>`;
}
function reasignado(t) { return !!t.responsableOp && t.responsableOp !== t.responsable; }
function respTxt(t) {
  if (reasignado(t)) return `<span class="chip reas">Reasignado</span><span>${t.responsable ? 'CEO: ' + esc(t.responsable) + ' → ' : ''}COO: ${esc(t.responsableOp)}</span>`;
  return t.responsable ? `<span>→ ${esc(t.responsable)}</span>` : '';
}
function ordenar(l) {
  return l.slice().sort((a, b) => (a.limite || '9999').localeCompare(b.limite || '9999') || (a.fechaCarga || '').localeCompare(b.fechaCarga || ''));
}

      </div>`;

function vistaGantt() {
  const ts = tareas().filter(t => S.verCerradas || t.avance !== 'Cerrado');
  const con = ts.filter(t => t.inicio || t.limite).sort((a, b) => (a.inicio || a.limite).localeCompare(b.inicio || b.limite));
  const sin = ts.filter(t => !t.inicio && !t.limite);
  const ley = CUADS.map(c => `<span class="ley"><i style="background:${c.c}"></i>${c.k}</span>`).join('');
  let h = `<section class="panel">
    <div class="barra"><h2 class="tit">Gantt de Dirección</h2>
    <label class="tog"><input type="checkbox" data-act="togCerr" ${S.verCerradas ? 'checked' : ''}> Mostrar cerradas</label></div>
    <div class="leyenda">${ley}<span class="ley"><i class="hoy-i"></i>Hoy</span><span class="ley"><i class="venc-i"></i>Vencida</span></div>`;
  if (!con.length) {
    h += '<div class="vacio">Todavía no hay tareas con fechas. Las fechas se cargan al pasar una idea a tarea en la Mesa.</div>';
  } else {
    const hoy = hoyD();
    let min = hoy, max = hoy;
    con.forEach(t => { const a = pd(t.inicio || t.limite), b = pd(t.limite || t.inicio); if (a < min) min = a; if (b > max) max = b; });
    let start = addD(min, -4); start = addD(start, -((start.getDay() + 6) % 7));
    let end = addD(max, 7); end = addD(end, 6 - ((end.getDay() + 6) % 7));
    if (dif(start, end) < 34) end = addD(start, 34);
    const nd = dif(start, end) + 1;
    const movil = window.innerWidth < 700;
    const nw = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--nw')) || 270;
    const disp = Math.min(window.innerWidth - 20, 1320) - 44 - 46 - nw;
    const dw = movil ? 18 : Math.max(14, Math.min(64, Math.floor(disp / nd)));
    const W = nd * dw;
    let meses = '', dias = '', lineas = '', fds = '';
    for (let i = 0; i < nd; i++) {
      const d = addD(start, i), wd = d.getDay(), fin = wd === 0 || wd === 6;
      if (i === 0 || d.getDate() === 1) {
        let j = i; while (j < nd && addD(start, j).getMonth() === d.getMonth()) j++;
        meses += `<div class="mes" style="left:${i * dw}px;width:${(j - i) * dw}px">${MESES_L[d.getMonth()]} ${d.getFullYear()}</div>`;
      }
      if (fin) fds += `<div class="fds" style="left:${i * dw}px;width:${dw}px"></div>`;
      if (wd === 1) lineas += `<div class="g-sem" style="left:${i * dw}px"></div>`;
      if (dw >= 24) dias += `<div class="dia ${fd(d) === S.hoy ? 'hoy' : ''} ${fin ? 'fin' : ''}" style="left:${i * dw}px;width:${dw}px">${d.getDate()}</div>`;
      else if (wd === 1) dias += `<div class="dia semh" style="left:${i * dw}px;width:${7 * dw}px">${d.getDate()} ${MESES[d.getMonth()]}</div>`;
    }
    S.xHoy = dif(start, hoy) * dw + dw / 2;
    const tagHoy = dw >= 24 ? '' : `<div class="hoy-tag" style="left:${S.xHoy}px">Hoy</div>`;
    const filas = con.map(t => {
      const c = colorCuad(t.cuadrante), cerr = t.avance === 'Cerrado', v = vencida(t);
      let bar;
      if (t.inicio && t.limite) {
        const a = pd(t.inicio), b = pd(t.limite), l = dif(start, a) * dw, w = Math.max((dif(a, b) + 1) * dw, dw);
        const nDias = dif(a, b) + 1;
        const lbl = t.inicio === t.limite ? fcorta(t.inicio) : fcorta(t.inicio) + ' → ' + fcorta(t.limite);
        const tip = fmt(t.inicio) + ' → ' + fmt(t.limite) + ' (' + nDias + (nDias === 1 ? ' día)' : ' días)');
        const entra = w >= lbl.length * 8 + 22;
        bar = `<div class="g-bar ${v ? 'venc' : ''} ${cerr ? 'cerr' : ''}" style="left:${l}px;width:${w}px;--c:${c}" title="${esc(tip)}">${entra ? esc(lbl) : ''}</div>`
            + (entra ? '' : `<span class="g-lbl" style="left:${l + w + 10}px">${esc(lbl)}</span>`);
      } else {
        const d = pd(t.limite || t.inicio), l = dif(start, d) * dw + dw / 2 - 12;
        const et = (t.limite ? 'Límite ' : 'Arranque ') + fcorta(t.limite || t.inicio);
        bar = `<div class="g-hito ${v ? 'venc' : ''}" style="left:${l}px;--c:${c}" title="${esc(et)}"></div><span class="g-lbl" style="left:${l + 32}px">${esc(et)}</span>`;
      }
      return `<div class="g-row"><button class="g-name" data-act="ver" data-id="${esc(t.id)}" style="--c:${c}"><span>${esc(t.tema)}</span><small>${esc(t.cuadrante)} · ${esc(t.avance || '')}${v ? ' · <b class="vencida">Vencida</b>' : ''}</small></button><div class="g-track" style="width:${W}px">${bar}</div></div>`;
    }).join('');
    h += `<div class="gantt"><div class="g-scroll" id="gScroll"><div style="width:calc(var(--nw) + ${W}px)">
      <div class="g-row g-head"><div class="g-name g-hn">Tema</div><div class="g-track" style="width:${W}px">${meses}${dias}${tagHoy}</div></div>
      <div class="g-body"><div class="g-over" style="width:${W}px">${fds}${lineas}<div class="g-hoy" style="left:${S.xHoy - 1}px"></div></div>${filas}</div>
    </div></div></div>`;
  }
  if (sin.length) h += `<h3 class="sub-t">Tareas sin fechas (${sin.length})</h3><div class="lista" style="padding:0">${sin.map(card).join('')}</div>`;
  return h + '</section>';
}

    <div class="lista" style="padding:0">${arch.length ? arch.map(t => `<button class="card" style="--c:var(--q4)" data-act="ver" data-id="${esc(t.id)}"><div class="t">${esc(t.tema)}</div><div class="meta"><span>Anotado el ${fmt(t.fechaCarga)}</span></div></button>`).join('') : '<div class="vacio">No hay temas archivados.</div>'}</div>

/* ---------- Ventanas ---------- */
function modal(html) {
  $('#modal').innerHTML = `<div class="velo"><div class="modal" role="dialog" aria-modal="true"><button class="x" data-act="cerrarModal" aria-label="Volver" title="Volver">✕</button>${html}</div></div>`;
  document.body.classList.add('con-modal');
}
function cerrarModal() {
  if (rec) { try { rec.stop(); } catch (e) {} }
  $('#modal').innerHTML = '';
  document.body.classList.remove('con-modal');
}
const modalAbierto = () => !!$('#modal').innerHTML;

// Nueva idea
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
function abrirNueva() {
  modal(`<h3>Nueva idea</h3>
    <label class="l" for="nTema">¿Qué tema o idea querés anotar?</label>
    <div class="dict"><textarea class="in grande" id="nTema" placeholder="${SR ? 'Escribí o tocá el micrófono y hablá' : 'Escribí el tema'}"></textarea>
    ${SR ? `<button class="mic" type="button" data-act="dictar" title="Dictar con la voz">${IC.mic}</button>` : ''}</div>
    <label class="l" for="nDet">Detalle <span class="nota">(opcional)</span></label>
    <textarea class="in" id="nDet" style="min-height:80px"></textarea>
    <label class="l" for="nFecha">Fecha</label>
    <input type="date" class="in" id="nFecha" value="${esc(S.hoy)}">
    <div id="mErr" class="err"></div>
    <div class="acciones"><button class="btn pri" data-act="guardarIdea">Guardar idea</button><button class="btn volver" data-act="cerrarModal">← Volver</button></div>`);
  setTimeout(() => { const t = $('#nTema'); if (t) t.focus(); }, 60);
}
function dictar(btn) {
  if (rec) { rec.stop(); return; }
  const ta = $('#nTema');
  const base = ta.value.trim() ? ta.value.trim() + ' ' : '';
  rec = new SR(); rec.lang = 'es-AR'; rec.interimResults = true; rec.continuous = false;
  rec.onresult = e => { let txt = ''; for (let i = 0; i < e.results.length; i++) txt += e.results[i][0].transcript; ta.value = base + txt; };
  rec.onerror = () => toast('No se pudo usar el micrófono', true);
  rec.onend = () => { rec = null; btn.classList.remove('on'); };
  btn.classList.add('on');
  try { rec.start(); } catch (e) { rec = null; btn.classList.remove('on'); }
}
async function guardarIdea() {
  const tema = $('#nTema').value.trim();
  if (!tema) { $('#mErr').textContent = 'Escribí el tema antes de guardar.'; return; }
  const ok = await enviar('nuevaIdea', { datos: { tema, detalle: $('#nDet').value.trim(), fechaCarga: $('#nFecha').value || S.hoy } }, 'Idea guardada. Se trata en la próxima Mesa.');
  if (ok) cerrarModal();
}

// Detalle de un tema
function abrirDetalle(id) {
  const t = S.temas.find(x => x.id === id); if (!t) return;
  if (t.etapa === 'Idea') { if (S.rol === 'CEO') abrirMesa(id); return; }
  const coo = S.rol === 'COO';
  form = { id, avance: t.avance };
  const etiqueta = t.etapa === 'Tarea' ? t.cuadrante : 'Archivada';
  modal(`<span class="pill" style="--c:${t.etapa === 'Tarea' ? colorCuad(t.cuadrante) : 'var(--q4)'}">${esc(etiqueta)}</span>
    <h3>${esc(t.tema)}</h3>
    ${t.detalle ? `<div class="det">${esc(t.detalle)}</div>` : ''}
    <dl class="datos">
      <div><dt>Anotado</dt><dd>${fmt(t.fechaCarga)} · ${haceTxt(t.fechaCarga)}</dd></div>
      <div><dt>Validado en Mesa</dt><dd>${fmt(t.validacion)}</dd></div>
      <div><dt>Urgencia / Importancia</dt><dd>${esc(t.urgencia || '—')} / ${esc(t.importancia || '—')}</dd></div>
      <div><dt>Arranque → Límite</dt><dd class="${vencida(t) ? 'vencida' : ''}">${fmt(t.inicio)} → ${fmt(t.limite)}</dd></div>
      ${t.responsable ? `<div><dt>Responsable (definió el CEO)</dt><dd>${esc(t.responsable)}</dd></div>` : ''}
      ${reasignado(t) ? `<div><dt>Lo hace en la práctica (COO)</dt><dd class="reas-t">${esc(t.responsableOp)} · Reasignado</dd></div>` : ''}
      <div><dt>Última actualización</dt><dd>${t.actualizacion ? fmt(t.actualizacion) + ' ' + esc(String(t.actualizacion).slice(11, 16)) : '—'}</dd></div>
    </dl>
    ${t.etapa === 'Tarea' ? `
      <label class="l">Avance ${coo ? '' : '<span class="nota">(lo actualiza el COO)</span>'}</label>
      <div class="seg seg5" id="segAv">${AVANCES.map(a => `<button type="button" class="${a === t.avance ? 'on' : ''}" ${coo ? `data-act="setAv" data-v="${a}"` : 'disabled'}>${a}</button>`).join('')}</div>
      <label class="l" for="fCom">Comentario del COO</label>
      ${coo ? `<textarea class="in" id="fCom" placeholder="¿Cómo viene este tema?">${esc(t.comentario)}</textarea>`
            : `<div class="leer">${t.comentario ? esc(t.comentario) : '<em>Sin comentarios todavía</em>'}</div>`}
      ${coo && t.cuadrante === 'Delegar' ? `<label class="l" for="fResp">¿Quién lo hace en la práctica? <span class="nota">(solo si no es ${esc(t.responsable || 'el definido por el CEO')})</span></label><input class="in" id="fResp" value="${esc(t.responsableOp)}" placeholder="Dejalo vacío si lo hace ${esc(t.responsable || 'quien definió el CEO')}">` : ''}` : ''}
    <div class="acciones">
      ${coo && t.etapa === 'Tarea' ? '<button class="btn pri" data-act="guardarDet">Guardar avance</button>' : ''}
      ${!coo ? (t.etapa === 'Tarea' ? `<button class="btn sec" data-act="mesa" data-id="${esc(t.id)}">Reclasificar</button><button class="btn peligro" data-act="archivar" data-id="${esc(t.id)}">Archivar</button>`
                                    : `<button class="btn sec" data-act="reactivar" data-id="${esc(t.id)}">Volver a Ideas</button>`) : ''}
      <button class="btn volver" data-act="cerrarModal">← Volver</button>
    </div>`);
}

// Tratar en la Mesa / Reclasificar
function abrirMesa(id) {
  if (S.rol !== 'CEO') return;
  const t = S.temas.find(x => x.id === id); if (!t) return;
  const sug = sugerir(t.urgencia, t.importancia);
  form = { id, u: t.urgencia || '', i: t.importancia || '', cuad: t.cuadrante || '', manual: !!t.cuadrante && t.cuadrante !== sug, esIdea: t.etapa !== 'Tarea' };
  const seg = (grp, val) => NIVELES.map(n => `<button type="button" class="${n === val ? 'on' : ''}" data-act="nivel" data-grp="${grp}" data-v="${n}">${n}</button>`).join('');
  modal(`<h3>${form.esIdea ? 'Tratar en la Mesa' : 'Reclasificar tema'}</h3>
    <label class="l" for="mTema">Tema</label>
    <input class="in" id="mTema" value="${esc(t.tema)}">
    <label class="l" for="mDet">Detalle <span class="nota">(opcional)</span></label>
    <textarea class="in" id="mDet" style="min-height:70px">${esc(t.detalle)}</textarea>
    <label class="l">¿Qué tan urgente es?</label>
    <div class="seg" id="segU">${seg('u', form.u)}</div>
    <label class="l">¿Qué tan importante es para la empresa?</label>
    <div class="seg" id="segI">${seg('i', form.i)}</div>
    <div id="mDestino"></div>
    <div class="dos">
      <div><label class="l" for="mIni" id="lIni">Fecha de arranque</label><input type="date" class="in" id="mIni" value="${esc(t.inicio)}"></div>
      <div><label class="l" for="mLim" id="lLim">Fecha límite</label><input type="date" class="in" id="mLim" value="${esc(t.limite)}"></div>
    </div>
    <div id="bResp"><label class="l" for="mResp">¿A quién se delega?</label><input class="in" id="mResp" value="${esc(t.responsable)}" placeholder="Nombre o área"></div>
    <div id="mErr" class="err"></div>
    <div class="acciones">
      <button class="btn pri" data-act="mesaOk">${form.esIdea ? 'Pasar a tarea' : 'Guardar cambios'}</button>
      ${form.esIdea ? '<button class="btn peligro" data-act="mesaArch">Archivar idea</button>' : ''}
      <button class="btn volver" data-act="cerrarModal">← Volver</button>
    </div>`);
  pintarMesa();
}
function pintarMesa() {
  if (!form.manual) form.cuad = sugerir(form.u, form.i);
  ['u', 'i'].forEach(g => document.querySelectorAll(`#seg${g.toUpperCase()} button`).forEach(b => b.classList.toggle('on', b.dataset.v === form[g])));
  const box = $('#mDestino');
  if (!form.cuad) {
    box.innerHTML = '<div class="aviso">Elegí urgencia e importancia: la app sugiere en qué cuadrante va.</div>';
  } else {
    const c = CUADS.find(x => x.k === form.cuad);
    box.innerHTML = `<div class="destino" style="--c:${c.c}">Va a: ${c.k.toUpperCase()}<small>${form.manual ? 'Ubicación elegida a mano' : 'Sugerido según urgencia e importancia'}</small></div>
      <div class="cambiar">¿Preferís otra ubicación?</div>
      <div class="qbtns">${CUADS.map(q => `<button type="button" style="--c:${q.c}" class="${q.k === form.cuad ? 'on' : ''}" data-act="cuadManual" data-v="${q.k}">${q.k}</button>`).join('')}</div>`;
  }
  const prog = form.cuad === 'Programar';
  $('#lIni').innerHTML = 'Fecha de arranque ' + (prog ? '<span class="nota">(necesaria)</span>' : '<span class="nota">(opcional)</span>');
  $('#lLim').innerHTML = 'Fecha límite ' + (prog ? '<span class="nota">(necesaria)</span>' : '<span class="nota">(opcional)</span>');
  $('#bResp').classList.toggle('oculto', form.cuad !== 'Delegar' && !$('#mResp').value);
}
async function mesaOk() {
  const err = $('#mErr'); err.textContent = '';
  const tema = $('#mTema').value.trim();
  const ini = $('#mIni').value, lim = $('#mLim').value;
  if (!tema) return (err.textContent = 'El tema no puede quedar vacío.');
  if (!form.u || !form.i) return (err.textContent = 'Falta elegir urgencia e importancia.');
  if (form.cuad === 'Programar' && (!ini || !lim)) return (err.textContent = 'Para "Programar" cargá la fecha de arranque y la fecha límite.');
  if (ini && lim && ini > lim) return (err.textContent = 'La fecha de arranque no puede ser posterior a la fecha límite.');
  const ok = await enviar('editarTema', { id: form.id, datos: {
    tema, detalle: $('#mDet').value.trim(), etapa: 'Tarea', urgencia: form.u, importancia: form.i,
    cuadrante: form.cuad, inicio: ini, limite: lim, responsable: $('#mResp').value.trim()
  } }, form.esIdea ? 'Pasó a tarea: ' + form.cuad : 'Cambios guardados');
  if (ok) cerrarModal();
}

/* ---------- Acciones ---------- */
const H = {
  entrar: () => doEntrar(),
  salir: () => { if (confirm('¿Salir de la Mesa de Dirección en este equipo?')) { guardarPin(''); S.pin = ''; vistaLogin(); } },
  recargar: () => recargar(false),
  tab: el => { S.tab = el.dataset.v; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  togCerr: () => { S.verCerradas = !S.verCerradas; render(); },
  nueva: () => abrirNueva(),
  dictar: el => dictar(el),
  guardarIdea: () => guardarIdea(),
  cerrarModal: () => cerrarModal(),
  ver: el => abrirDetalle(el.dataset.id),
  mesa: el => abrirMesa(el.dataset.id),
  nivel: el => { form[el.dataset.grp] = el.dataset.v; form.manual = false; pintarMesa(); },
  cuadManual: el => { form.cuad = el.dataset.v; form.manual = form.cuad !== sugerir(form.u, form.i); pintarMesa(); },
  mesaOk: () => mesaOk(),
  mesaArch: async () => { if (!confirm('¿Archivar esta idea? Queda guardada en el Archivo.')) return; if (await enviar('editarTema', { id: form.id, datos: { etapa: 'Archivada' } }, 'Idea archivada')) cerrarModal(); },
  setAv: el => { form.avance = el.dataset.v; document.querySelectorAll('#segAv button').forEach(b => b.classList.toggle('on', b.dataset.v === form.avance)); },
  guardarDet: async () => {
    const datos = { avance: form.avance, comentario: $('#fCom').value.trim() };
    if ($('#fResp')) datos.responsableOp = $('#fResp').value.trim();
    if (await enviar('editarTema', { id: form.id, datos }, 'Avance actualizado')) cerrarModal();
  },
  archivar: async el => { if (!confirm('¿Archivar este tema? Queda guardado en el Archivo.')) return; if (await enviar('editarTema', { id: el.dataset.id, datos: { etapa: 'Archivada' } }, 'Tema archivado')) cerrarModal(); },
  reactivar: async el => { if (await enviar('editarTema', { id: el.dataset.id, datos: { etapa: 'Idea' } }, 'Volvió a la bandeja de Ideas')) cerrarModal(); },
  agAlta: async () => { const i = $('#agTema'); const tema = i.value.trim(); if (!tema) { i.focus(); return; } await enviar('nuevoAgenda', { datos: { tema } }, 'Agregado a la agenda'); },
  agToggle: async el => { const a = S.agenda.find(x => x.id === el.dataset.id); if (!a) return; await enviar('editarAgenda', { id: a.id, datos: { estado: a.estado === 'Tratado' ? 'Pendiente' : 'Tratado' } }); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const f = H[el.dataset.act];
  if (f) { if (el.tagName !== 'INPUT') e.preventDefault(); f(el); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && modalAbierto()) cerrarModal();
  if (e.key === 'Enter' && e.target.id === 'agTema') H.agAlta();
});

/* ---------- Avisos ---------- */
function ocupado(on, txt) { S.ocupado = on; $('#busyTxt').textContent = txt || 'Cargando…'; $('#busy').classList.toggle('on', on); }
let tToast;
function toast(msg, bad) {
  const t = $('#toast'); t.textContent = msg; t.classList.toggle('bad', !!bad); t.classList.add('on');
  clearTimeout(tToast); tToast = setTimeout(() => t.classList.remove('on'), 3200);
}

/* ---------- Actualización automática ---------- */
setInterval(() => { if (S.rol && !modalAbierto() && !S.ocupado && document.visibilityState === 'visible') recargar(true); }, 60000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.rol && !modalAbierto() && !S.ocupado) recargar(true); });
let tResize; window.addEventListener('resize', () => { clearTimeout(tResize); tResize = setTimeout(() => { if (S.rol && S.tab === 'gantt') render(); }, 250); });

/* ---------- Modo demostración ---------- */
const Demo = (() => {
  const h = new Date(); h.setHours(12, 0, 0, 0);
  const d = n => fd(addD(h, n));
  const ahora = () => { const x = new Date(); return fd(x) + ' ' + String(x.getHours()).padStart(2, '0') + ':' + String(x.getMinutes()).padStart(2, '0'); };
  let n = 0, na = 0;
  const T = o => Object.assign({ id: 'T-' + String(++n).padStart(4, '0'), fechaCarga: d(-6), tema: '', detalle: '', etapa: 'Tarea', urgencia: 'Mucho', importancia: 'Mucho',
    cuadrante: 'Hacer ya', inicio: '', limite: '', responsable: '', avance: 'Recibido', comentario: '', validacion: d(-4), actualizacion: d(-1) + ' 10:15' }, o);
  const temas = [
    T({ tema: 'Revisar desvío de costos en la obra en curso', fechaCarga: d(-9), inicio: d(-3), limite: d(4), avance: 'En curso', comentario: 'Pedí a Compras el detalle por partida. Lo vemos el jueves.' }),
    T({ tema: 'Responder reclamo de cliente por demora de entrega', fechaCarga: d(-1), validacion: d(-1), limite: d(2) }),
    T({ tema: 'Definir proveedor de chapa por aumento de precios', fechaCarga: d(-12), inicio: d(-10), limite: d(-2), avance: 'Bloqueado', comentario: 'Esperando la cotización de dos proveedores.' }),
    T({ tema: 'Plan de capacitación en seguridad para el taller', urgencia: 'Algo', cuadrante: 'Programar', inicio: d(7), limite: d(35), avance: 'Aceptado' }),
    T({ tema: 'Ordenar y señalizar el pañol central', urgencia: 'Poco', cuadrante: 'Programar', fechaCarga: d(-15), inicio: d(-10), limite: d(20), avance: 'En curso' }),
    T({ tema: 'Presupuesto 2027 por unidad de negocio', urgencia: 'Algo', cuadrante: 'Programar', inicio: d(14), limite: d(60) }),
    T({ tema: 'Renovar seguros de los vehículos', importancia: 'Poco', cuadrante: 'Delegar', responsable: 'Administración', limite: d(10), avance: 'Aceptado' }),
    T({ tema: 'Actualizar legajos del personal', importancia: 'Poco', cuadrante: 'Delegar', responsable: 'RRHH', avance: 'En curso' }),
    T({ tema: 'Cambiar el proveedor de agua del comedor', urgencia: 'Poco', importancia: 'Poco', cuadrante: 'No es de Dirección' }),
    T({ tema: 'Firmar contrato con cliente nuevo', fechaCarga: d(-25), inicio: d(-20), limite: d(-12), avance: 'Cerrado', comentario: 'Firmado.' }),
    T({ tema: 'Evaluar compra de una segunda plegadora', detalle: 'Ver si conviene comprar o tercerizar.', fechaCarga: d(-4), etapa: 'Idea', urgencia: '', importancia: '', cuadrante: '', avance: '', validacion: '' }),
    T({ tema: 'Visitar la feria de la construcción', fechaCarga: d(-2), etapa: 'Idea', urgencia: '', importancia: '', cuadrante: '', avance: '', validacion: '' }),
    T({ tema: 'Video institucional de la planta', fechaCarga: d(0), etapa: 'Idea', urgencia: '', importancia: '', cuadrante: '', avance: '', validacion: '' }),
    T({ tema: 'Cambiar el diseño de los cascos', fechaCarga: d(-20), etapa: 'Archivada', urgencia: '', importancia: '', cuadrante: '', avance: '', validacion: '' })
  ];
  const A = o => Object.assign({ id: 'A-' + String(++na).padStart(4, '0'), fecha: d(-2), tema: '', detalle: '', estado: 'Pendiente', fechaTratado: '' }, o);
  const agenda = [
    A({ tema: 'Definir criterio de horas extra para noviembre' }),
    A({ tema: 'Prioridad entre las dos obras de diciembre', fecha: d(-1) }),
    A({ tema: 'Presentar avance del plan de compras', fecha: d(-8), estado: 'Tratado', fechaTratado: d(-5) })
  ];
  const copia = o => JSON.parse(JSON.stringify(o));
  return {
    get(pin) {
      const rol = pin === '1111' ? 'CEO' : pin === '2222' ? 'COO' : null;
      if (!rol) return Promise.reject(new Error('PIN incorrecto'));
      return Promise.resolve({ rol, hoy: d(0), semaforo: { amarillo: 10, rojo: 15 }, temas: copia(temas), agenda: copia(agenda) });
    },
    post(rol, accion, x) {
      try {
        if (accion === 'nuevaIdea') {
          temas.push(T({ tema: x.datos.tema, detalle: x.datos.detalle || '', fechaCarga: x.datos.fechaCarga || d(0), etapa: 'Idea', urgencia: '', importancia: '', cuadrante: '', avance: '', validacion: '', actualizacion: ahora() }));
        } else if (accion === 'editarTema') {
          const t = temas.find(z => z.id === x.id); if (!t) throw new Error('No encuentro el tema');
          Object.keys(x.datos).forEach(k => {
            if ((k === 'avance' || k === 'comentario') && rol !== 'COO') throw new Error('Solo el COO puede cambiar el avance');
            if (k === 'responsableOp' && rol !== 'COO') throw new Error('Solo el COO puede reasignar');
            if (k !== 'avance' && k !== 'comentario' && k !== 'responsableOp' && rol !== 'CEO') throw new Error('Solo el CEO puede clasificar');
            t[k] = x.datos[k] == null ? '' : x.datos[k];
          });
          if (t.etapa === 'Tarea') { if (!t.validacion) t.validacion = d(0); if (!t.avance) t.avance = 'Recibido'; }
          t.actualizacion = ahora();
        } else if (accion === 'nuevoAgenda') {
          if (rol !== 'COO') throw new Error('Solo el COO carga temas de agenda');
          agenda.push(A({ tema: x.datos.tema, fecha: d(0) }));
        } else if (accion === 'editarAgenda') {
          if (rol !== 'COO') throw new Error('Solo el COO edita la agenda');
          const a = agenda.find(z => z.id === x.id); if (!a) throw new Error('No encuentro el punto de agenda');
          a.estado = x.datos.estado; a.fechaTratado = a.estado === 'Tratado' ? d(0) : '';
        } else throw new Error('Acción desconocida');
        return new Promise(r => setTimeout(() => r({}), 300));
      } catch (e) { return Promise.reject(e); }
    }
  };
})();

/* ---------- Arranque ---------- */
(function inicio() {
  const p = leerPin();
  if (p) entrar(p, true); else vistaLogin();
})();
</script>
</body>
</html>
